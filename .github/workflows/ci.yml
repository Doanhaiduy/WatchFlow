# CI — typecheck, unit, db:audit + test tích hợp trên PostgreSQL dịch vụ, build. (Viết ở máy công ty, CHƯA chạy thật — ⏭ cloud)
name: ci
on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PG_PORT: "54329"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Cài PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-contrib-17 || sudo apt-get install -y -qq postgresql postgresql-contrib
          echo "PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm setup:local
      - run: pnpm db:audit
      - run: pnpm test:api
      - run: pnpm docs:check
      - run: pnpm build
