<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Mất kết nối · WatchFlow</title>
  <style>
    /* Glass tối giản, không phụ thuộc tệp ngoài (trang này chạy khi không có mạng). Màu theo src/styles/tokens.css. */
    :root { color-scheme: light dark; --page: #EEF1FB; --ink: #1B1B3A; --mute: #575A7E; --glass: rgba(255,255,255,.62); --line: rgba(255,255,255,.85); --accent: #5B5BF0; --on-accent: #fff; --a: #BCD6FF; --b: #E3D2FF; --shadow: 0 10px 32px rgba(91,91,240,.14); }
    @media (prefers-color-scheme: dark) { :root { --page: #0E1022; --ink: #ECEEFF; --mute: #AEB2D6; --glass: rgba(255,255,255,.07); --line: rgba(255,255,255,.14); --accent: #5E5EEE; --a: #1A2A6C; --b: #2D1F66; --shadow: 0 10px 32px rgba(0,0,0,.4); } }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
      background: radial-gradient(60% 50% at 15% 10%, var(--a), transparent 70%), radial-gradient(55% 50% at 90% 85%, var(--b), transparent 70%), var(--page); }
    .card { width: 100%; max-width: 380px; padding: 32px 26px 28px; text-align: center; background: var(--glass); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4); }
    .logo { width: 64px; height: 64px; border-radius: 18px; display: block; margin: 0 auto 16px; box-shadow: 0 8px 20px rgba(91,91,240,.3); }
    h1 { font-size: 21px; line-height: 1.3; margin: 0 0 8px; }
    p { font-size: 14.5px; line-height: 1.6; color: var(--mute); margin: 0 0 22px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 28px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; }
    .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
    .btn:active { transform: scale(.97); }
    .hint { margin: 16px 0 0; font-size: 12.5px; color: var(--mute); }
    @media (prefers-reduced-motion: no-preference) { .card { animation: rise .4s cubic-bezier(.2,.8,.2,1); } @keyframes rise { from { opacity: 0; transform: translateY(12px); } } }
  </style>
</head>
<body>
  <main class="card" role="main">
    <img class="logo" src="/icons/icon-192.png" width="64" height="64" alt="">
    <h1>Bạn đang mất kết nối</h1>
    <p>Không tải được trang. Kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại nhé. Dữ liệu cửa hàng không được lưu trên máy nên cần có mạng để làm việc.</p>
    <a class="btn" id="retry" href="/">Thử lại</a>
    <p class="hint" id="hint" hidden>Đã có mạng trở lại — đang tải lại…</p>
  </main>
  <script src="/offline.js"></script>
</body>
</html>
