<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WatchFlow · Mẫu 3 — Bento</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1EC;--ink:#17171C;--mute:#7B7782;--wht:#fff;
  --lil:#E6DEFF;--lil2:#6B52F0;--mint:#D3F2E2;--mint2:#13935F;--peach:#FFE0D0;--peach2:#E8561C;--lem:#FFF0B8;--lem2:#A87A00;--sky:#D7EAFF;--sky2:#2A78E0;--rose:#FFDAE5;--rose2:#D8355F;--lime:#C8F25C;
  --r:28px;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font:500 14px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
html.framed body::before{content:'';position:fixed;top:0;left:0;right:0;height:var(--safe-top);background:var(--bg);z-index:90}
button{background:none;border:0}a{color:inherit;text-decoration:none}
.only-d{display:none}

/* tones */
[data-tone=ok]{--tc:var(--mint2);--tb:var(--mint)}[data-tone=bad]{--tc:var(--rose2);--tb:var(--rose)}[data-tone=hold]{--tc:var(--lem2);--tb:var(--lem)}[data-tone=info]{--tc:var(--sky2);--tb:var(--sky)}[data-tone=check]{--tc:var(--lil2);--tb:var(--lil)}[data-tone=repair]{--tc:var(--peach2);--tb:var(--peach)}[data-tone=sold],[data-tone=draft]{--tc:#6E6A75;--tb:#E9E6EF}
.wf-chip{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--tb);color:var(--tc);white-space:nowrap;line-height:1.3}

/* tiles */
.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t{border-radius:var(--r);padding:18px;position:relative;overflow:hidden;background:var(--wht);min-width:0}
.t.s2{grid-column:span 2}
.lil{background:var(--lil)}.mint{background:var(--mint)}.peach{background:var(--peach)}.lem{background:var(--lem)}.sky{background:var(--sky)}.rose{background:var(--rose)}.wht{background:#fff}.ink{background:var(--ink);color:#fff}
.t .lb{font-size:12.5px;font-weight:600;opacity:.65;display:flex;align-items:center;gap:6px}
.t .n{font-size:32px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:8px}
.hero .n{font-size:40px}.t .n small{font-size:15px;font-weight:700;opacity:.55;margin-left:3px;letter-spacing:0}
.t .sb{font-size:12px;opacity:.7;margin-top:4px;font-weight:500}
.pl{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--lime);color:#1B2A00}
.t .corner{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.65);display:grid;place-items:center;color:var(--ink)}
.t .rg{position:absolute;right:16px;bottom:16px}
.th2{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.th2 h3{font-size:16px;font-weight:800;letter-spacing:-.01em}.th2 a{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:rgba(23,23,28,.07);cursor:pointer}
.ink .th2 a{background:rgba(255,255,255,.14)}

/* header */
.top{padding:calc(14px + var(--safe-top)) 18px 14px;display:flex;align-items:center;gap:12px}
.top .hi small{display:block;color:var(--mute);font-size:12.5px;font-weight:600}.top .hi b{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.top .sp{flex:1}
.rb{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;position:relative;flex:none;cursor:pointer}
.rb .dot{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--peach2);border:2px solid #fff}
.rb.dk{background:var(--ink);color:#fff}
.av{width:44px;height:44px;border-radius:50%;background:var(--lime);display:grid;place-items:center;font-weight:800;flex:none}
.pgt{padding:calc(16px + var(--safe-top)) 18px 6px;display:flex;align-items:flex-end;gap:10px}
.pgt h1{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.1}.pgt p{color:var(--mute);font-size:13px;font-weight:500}.pgt .sp{flex:1}
.body{padding:8px 14px calc(120px + var(--safe-bottom))}

/* dock */
.dock{position:fixed;left:14px;right:14px;bottom:calc(14px + var(--safe-bottom));z-index:60;height:68px;border-radius:34px;background:var(--ink);display:flex;align-items:center;justify-content:space-around;padding:0 8px;box-shadow:0 16px 40px rgba(23,23,28,.35)}
.dock a{height:50px;min-width:50px;padding:0 14px;border-radius:25px;display:flex;align-items:center;justify-content:center;gap:8px;color:#A9A6B2;font-weight:700;font-size:13px;transition:.25s;cursor:pointer}
.dock a span{display:none}
.dock a.on{background:var(--lime);color:#14200A}.dock a.on span{display:inline}
.fab{position:fixed;right:20px;bottom:calc(98px + var(--safe-bottom));z-index:58;width:54px;height:54px;border-radius:50%;background:var(--lil2);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(107,82,240,.45);cursor:pointer}
.ov{position:fixed;inset:0;z-index:95;background:var(--bg);transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);overflow:auto;padding:calc(18px + var(--safe-top)) 16px 40px}
.ov.open{transform:none}
.ov h2{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:8px 4px 16px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mt a{border-radius:26px;padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;background:var(--tb);color:var(--ink);cursor:pointer}
.mt a i{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.7);display:grid;place-items:center;color:var(--tc)}
.mt a b{font-size:15px;font-weight:800;letter-spacing:-.01em}
.xclose{position:absolute;right:16px;top:calc(16px + var(--safe-top))}
.qs{position:fixed;left:0;right:0;bottom:0;z-index:96;background:var(--bg);border-radius:32px 32px 0 0;padding:14px 14px calc(24px + var(--safe-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.qs.open{transform:none}.qs.open~.scrim{opacity:1;pointer-events:auto}
.scrim{position:fixed;inset:0;background:rgba(23,23,28,.4);z-index:94;opacity:0;pointer-events:none;transition:.25s}
.qs .grab{width:40px;height:5px;border-radius:3px;background:#CFCBD6;margin:0 auto 14px}
.qs h3{font-size:20px;font-weight:800;margin:0 6px 12px}

/* common bits */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;font-weight:700;cursor:pointer}
.quick i{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--sky2)}
.mini{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}.mini::-webkit-scrollbar{display:none}
.mw{flex:none;width:104px;cursor:pointer}.mw .c{aspect-ratio:1;border-radius:50%;background:var(--tb,var(--lil));padding:8px;overflow:hidden}.mw b{display:block;font-size:12px;font-weight:700;margin-top:8px;line-height:1.25}.mw span{font-size:11px;color:var(--mute)}
.rowi{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(23,23,28,.12)}.rowi:last-child{border:0;padding-bottom:0}
.rowi .ic3{width:40px;height:40px;border-radius:14px;background:var(--tb);color:var(--tc);display:grid;place-items:center;flex:none}
.rowi .tx{flex:1;min-width:0}.rowi .tx b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowi .tx span{font-size:11.5px;color:var(--mute);display:block}
.rowi .rt{text-align:right;flex:none}.rowi .rt b{display:block;font-size:14px;font-weight:800}
.rowi .av2{width:40px;height:40px;border-radius:50%;background:var(--tb);color:var(--tc);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.prog{display:flex;gap:4px;margin-top:8px}.prog i{flex:1;height:5px;border-radius:3px;background:rgba(23,23,28,.1)}.prog i.f{background:var(--tc)}

/* chips filter */
.g-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px}.g-chips::-webkit-scrollbar{display:none}
.g-chip{padding:9px 16px;border-radius:999px;background:#fff;font-size:13px;font-weight:700;color:var(--mute);white-space:nowrap;cursor:pointer}
.g-chip.on{background:var(--ink);color:#fff}
.sbar{display:flex;gap:10px;margin-bottom:12px}
.sbar label{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;height:50px;padding:0 18px;color:var(--mute);min-width:0}
.sbar input{flex:1;border:0;outline:0;background:none;font:600 15px 'Plus Jakarta Sans';min-width:0;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;background:#fff;font-weight:800;color:var(--ink);font-size:14px;cursor:pointer;white-space:nowrap}
.btn.dk{background:var(--ink);color:#fff}.btn.lm{background:var(--lime);color:#14200A}.btn.lc{background:var(--lil2);color:#fff}.btn.block{width:100%}.btn.sm{height:38px;padding:0 16px;font-size:13px}

/* watch tiles */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wt{border-radius:var(--r);padding:12px;background:var(--bg2,#fff);cursor:pointer;position:relative;display:flex;flex-direction:column}
.wt .c{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.7);padding:5%;width:100%;overflow:hidden}
.wt.n1{--bg2:#fff}.wt.u1{--bg2:var(--lil)}.wt.r1{--bg2:var(--mint)}
.wt .st{position:absolute;top:12px;left:12px;z-index:2}
.wt b{font-size:14px;font-weight:800;letter-spacing:-.01em;margin-top:10px;line-height:1.25;min-height:36px}
.wt small{font-size:11.5px;color:#6E6A75;font-weight:500}
.wt .pr{display:flex;align-items:center;justify-content:space-between;margin-top:8px}.wt .pr strong{font-size:16px;font-weight:800;letter-spacing:-.02em}
.wt .pr i{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-style:normal}.wt .pr i.in{background:var(--lime);color:#14200A}

/* unit */
.unit{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.uh{border-radius:36px;background:var(--lil);padding:20px;position:relative;overflow:hidden;min-height:400px}
.uh .big{position:absolute;inset:10px 22% 104px;}
.uh .meta{position:absolute;left:20px;right:20px;bottom:18px}
.uh .meta b{font-size:24px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1.15}.uh .meta span{font-size:13px;opacity:.7}
.uh .st{position:absolute;left:18px;top:18px}
.uh .back{position:absolute;right:18px;top:18px}
.uprice{font-size:34px;font-weight:800;letter-spacing:-.04em}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acts button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:24px;background:#fff;font-size:12px;font-weight:700;cursor:pointer}
.acts button.dk{background:var(--ink);color:#fff}.acts button i{width:34px;height:34px;display:grid;place-items:center}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed rgba(23,23,28,.12);font-size:13.5px}.kv div:last-child{border:0}.kv span{opacity:.6}.kv b{font-weight:700;text-align:right}
.tl{list-style:none;padding:0}.tl li{padding:0 0 14px 20px;position:relative}.tl li::before{content:'';position:absolute;left:0;top:5px;width:10px;height:10px;border-radius:50%;background:var(--lil2)}.tl li::after{content:'';position:absolute;left:4px;top:18px;bottom:0;width:2px;background:rgba(23,23,28,.1)}.tl li:last-child::after{display:none}.tl li b{display:block;font-size:13.5px}.tl li span{font-size:12px;opacity:.6}

/* POS */
.pos{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.cartbar{position:fixed;left:14px;right:14px;bottom:calc(92px + var(--safe-bottom));z-index:55;background:var(--lil2);color:#fff;border-radius:999px;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 20px;box-shadow:0 12px 28px rgba(107,82,240,.4)}
.cartbar .t2{flex:1}.cartbar small{display:block;opacity:.8;font-size:11.5px}.cartbar b{font-size:18px;font-weight:800;letter-spacing:-.02em}
.cart{position:fixed;left:0;right:0;bottom:0;z-index:96;background:var(--ink);color:#fff;border-radius:32px 32px 0 0;padding:14px 18px calc(24px + var(--safe-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto}
.cart.open{transform:none}.cart.open~.scrim{opacity:1;pointer-events:auto}
.cart .grab{width:40px;height:5px;border-radius:3px;background:#4A4852;margin:0 auto 12px}
.cart h3{font-size:20px;font-weight:800;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cl{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px dashed rgba(255,255,255,.16)}
.cl .c{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.1);padding:4px;flex:none;overflow:hidden;display:grid;place-items:center;color:var(--lime)}
.cl .tx{flex:1;min-width:0}.cl .tx b{display:block;font-size:13.5px;font-weight:700}.cl .tx span{font-size:11.5px;opacity:.6}
.cl .p{font-weight:800;min-width:72px;text-align:right}.cl .rm{opacity:.5;padding:4px}
.qty{display:flex;align-items:center;background:rgba(255,255,255,.1);border-radius:999px;height:30px}.qty button{width:28px;height:30px;display:grid;place-items:center;color:#fff}.qty span{min-width:18px;text-align:center;font-weight:700}
.sum div{display:flex;justify-content:space-between;padding:7px 0;opacity:.75}.sum div b{font-weight:700}
.sum .tot{opacity:1;border-top:1px dashed rgba(255,255,255,.2);margin-top:6px;padding-top:12px;align-items:baseline}.sum .tot b{font-size:30px;font-weight:800;letter-spacing:-.04em;color:var(--lime)}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.pills button{height:42px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff;font-weight:700;font-size:13px}.pills button.on{background:var(--lime);color:#14200A}
.recv{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:20px;padding:10px 16px;margin-bottom:6px}.recv span{font-size:12px;opacity:.7}.recv input{flex:1;border:0;background:none;text-align:right;font:800 24px 'Plus Jakarta Sans';outline:0;color:#fff;min-width:0;letter-spacing:-.03em}
.calc{display:flex;justify-content:space-between;font-size:13px;padding:4px 6px 14px;opacity:.9}.calc .ok{color:var(--lime)}.calc .bad{color:#FF8FA9}
.cust{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.1);padding:12px 16px;border-radius:20px;margin:8px 0;cursor:pointer;font-weight:700}.cust span{display:block;font-weight:500;opacity:.6;font-size:12px}

/* repair, cash */
.rt2{border-radius:var(--r);padding:16px;background:var(--tb);display:flex;flex-direction:column;gap:6px}
.rt2 .tp{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;opacity:.8}
.rt2 h4{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2}.rt2 p{font-size:12.5px;opacity:.7}
.rt2 .ft{display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px;font-size:12px}.rt2 .ft b{font-size:18px;font-weight:800;letter-spacing:-.02em;display:block;text-align:right}
.rgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.fl{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 4px;scroll-snap-type:x mandatory}.fl::-webkit-scrollbar{display:none}
.fund{flex:none;width:200px;border-radius:var(--r);padding:16px;scroll-snap-align:start;min-height:130px;display:flex;flex-direction:column;justify-content:space-between}
.fund small{opacity:.65;font-weight:600;font-size:12px}.fund b{font-size:24px;font-weight:800;letter-spacing:-.03em;display:block;margin-top:4px}.fund i{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.65);display:grid;place-items:center;font-style:normal;color:var(--ink)}
.lg{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px dashed rgba(23,23,28,.12)}.lg:last-child{border:0}
.lg .ic3{width:40px;height:40px;border-radius:50%;background:var(--tb);color:var(--tc);display:grid;place-items:center;flex:none}
.lg .tx{flex:1;min-width:0}.lg .tx b{display:block;font-size:13.5px;font-weight:700}.lg .tx span{font-size:11.5px;color:var(--mute)}.lg .a{font-weight:800;letter-spacing:-.02em}.lg .a.in{color:var(--mint2)}.lg .a.out{color:var(--rose2)}
.seg{display:flex;background:#fff;border-radius:999px;padding:4px;margin-bottom:12px}.seg button{flex:1;white-space:nowrap;padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;color:var(--mute)}.seg .on{background:var(--ink);color:#fff}
.fld{display:block;margin-bottom:12px}.fld span{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:0 0 4px 4px}.fld input,.fld textarea{width:100%;border:0;border-radius:20px;background:#fff;padding:14px 16px;font:600 15px 'Plus Jakarta Sans';outline:0}
.steps{display:flex;gap:6px;margin:4px 0 14px}.steps button{flex:1;height:36px;border-radius:999px;background:#fff;font-size:12px;font-weight:700;color:var(--mute)}.steps button.on{background:var(--ink);color:#fff}

/* generic */
.g-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.g-kpi{border-radius:24px;padding:14px 12px}.g-kpi:nth-child(1){background:var(--lil)}.g-kpi:nth-child(2){background:var(--mint)}.g-kpi:nth-child(3){background:var(--lem)}
.g-kpi span{display:block;font-size:11px;font-weight:600;opacity:.65;line-height:1.3;min-height:28px}.g-kpi b{display:block;font-size:19px;font-weight:800;letter-spacing:-.03em;margin-top:4px}.g-kpi em{font-style:normal;font-size:10.5px;opacity:.6}
.g-list{display:grid;gap:8px}
.g-item{display:flex;gap:12px;align-items:center;padding:14px;background:#fff;border-radius:24px}
.g-ico{width:44px;height:44px;border-radius:50%;background:var(--tb,var(--sky));color:var(--tc,var(--sky2));display:grid;place-items:center;flex:none}.g-av{font-weight:800;font-size:14px}
.g-main{flex:1;min-width:0}.g-t{font-weight:700;line-height:1.3}.g-s{font-size:12px;color:var(--mute);margin-top:2px}
.g-end{text-align:right;flex:none;max-width:44%}.g-amt{font-weight:800;font-size:15px;letter-spacing:-.02em}.g-sub{font-size:11.5px;color:var(--mute)}
[data-neg]{color:var(--rose2);font-weight:700}
.g-bar{height:6px;border-radius:3px;background:#EEEAF3;margin-top:8px;max-width:200px;overflow:hidden}.g-bar i{display:block;height:100%;border-radius:3px;background:var(--tc)}
.g-thumb{width:60px;flex:none}.g-thumb .wf-img{aspect-ratio:1;background:var(--lil);border-radius:50%;padding:6px;overflow:hidden}
.g-btns{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}.g-btn{font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;background:var(--ink);color:#fff}.g-btn.ghost{background:#EEEAF3;color:var(--ink)}
.g-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;height:52px;border-radius:999px;background:var(--lime);color:#14200A;font-weight:800}
.g-block{margin-bottom:18px}.g-h{font-size:17px;font-weight:800;margin:6px 4px 10px}.g-res{align-items:flex-start}
.tabs{display:flex;gap:4px;margin-bottom:12px;background:#fff;border-radius:999px;padding:4px;overflow-x:auto;scrollbar-width:none}.tabs button{flex:1;padding:9px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--mute);white-space:nowrap}.tabs button.on{background:var(--ink);color:#fff}
.legend{display:flex;gap:14px;font-size:12px;opacity:.75;margin-bottom:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}

/* ================= DESKTOP ================= */
@media(min-width:900px){
  .only-m{display:none!important}.only-d{display:block}
  .dock,.fab,.cartbar,.top{display:none}

      '<div class="wgrid" id="pg" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">'+list.map(function(w){var cl=w.cg==='used'?'u1':w.cg==='refurb'?'r1':'n1';return '<div class="wt '+cl+'" data-cat="'+w.cg+'" data-add="'+w.id+'">'+wthumb(w)+'<b>'+w.brand+' '+w.model+'</b><small>'+w.id+' · '+w.cond+'</small><div class="pr"><strong>'+WF.short(w.price)+'</strong><i data-add="'+w.id+'">'+ic('plus',16)+'</i></div></div>';}).join('')+WF.accessories.map(function(a){return '<div class="wt sky" style="background:var(--sky)" data-cat="acc" data-add="'+a.id+'"><div class="c" style="display:grid;place-items:center;color:var(--sky2)">'+ic(a.ic,34,1.4)+'</div><b>'+a.name+'</b><small>Phụ kiện bán lẻ</small><div class="pr"><strong>'+WF.short(a.price)+'</strong><i data-add="'+a.id+'">'+ic('plus',16)+'</i></div></div>';}).join('')+'</div></div>'+
      '<aside class="cart" id="cart"></aside><div class="scrim" data-close="#cart"></div></div><div class="cartbar" id="cartbar"></div>';
      return page('Bán hàng','Phiếu HD-1016-004 · nháp tự lưu',body,{mAct:'<button class="rb" data-go="sales">'+ic('receipt',20)+'</button>',acts:'<button class="btn" data-go="sales">'+ic('receipt',18)+' Lịch sử phiếu</button>'});
    },
    repair:function(){

      '<div class="g-chips" data-chips data-target="#rl">'+chips.map(function(c,i){return '<button class="g-chip'+(i?'':' on')+'" data-f="'+c[0]+'">'+c[1]+'</button>';}).join('')+'</div>'+
      '<div id="rl" class="rgrid">'+list.map(function(r){var m=WF.repairMeta[r.st],steps=['received','inspecting','repairing','waiting_parts','completed'],ix=steps.indexOf(r.st);return '<article class="rt2" data-tone="'+m.tone+'" data-cat="'+r.st+'"><div class="tp"><span>'+r.code+(r.internal?' · Nội bộ':'')+'</span>'+WF.chip(m.label,m.tone)+'</div><h4>'+r.watch+'</h4><p>'+r.cust+' — '+r.issue+'</p><div class="prog">'+[0,1,2,3,4].map(function(i){return '<i class="'+(i<=ix?'f':'')+'"></i>';}).join('')+'</div><div class="ft"><span>'+r.tech+'<br>Hẹn '+r.due+(r.late?' · <b style="display:inline;font-size:12px;color:var(--rose2)">chưa lấy</b>':'')+'</span><span>'+(r.deposit?'Cọc '+WF.short(r.deposit)+'<br>':'')+'<b>'+(r.quote?vnd(r.quote):'Chưa báo giá')+'</b></span></div></article>';}).join('')+'</div>'+
      '<div class="qs" id="recv" data-tabs><div class="grab"></div><h3>Nhận máy sửa</h3><div class="steps"><button class="on" data-tab="1">Khách</button><button data-tab="2">Máy</button><button data-tab="3">Lỗi</button><button data-tab="4">Cọc</button></div><div data-pane="1" class="on"><label class="fld"><span>SĐT khách</span><input value="0912 345 678"></label><label class="fld"><span>Tên khách</span><input value="Phạm Thị Thu"></label><button class="btn dk block" data-tab="2">Tiếp tục</button></div><div data-pane="2"><label class="fld"><span>Thương hiệu · model</span><input value="Casio Edifice EFB-530"></label><label class="fld"><span>Serial (nếu có)</span><input placeholder="Bỏ trống được"></label><button class="btn block" style="margin-bottom:10px" data-toast="Chụp ảnh hiện trạng">'+ic('camera',18)+' Chụp ảnh hiện trạng</button><button class="btn dk block" data-tab="3">Tiếp tục</button></div><div data-pane="3"><label class="fld"><span>Khách mô tả lỗi</span><textarea rows="3">Đứt dây kim loại, kính trầy nhẹ</textarea></label><button class="btn dk block" data-tab="4">Tiếp tục</button></div><div data-pane="4"><label class="fld"><span>Tiền cọc (tùy chọn)</span><input value="200.000"></label><button class="btn lm block" data-close="#recv" data-toast="Đã nhận máy — in phiếu SC-0416">Nhận máy & in phiếu</button></div></div><div class="scrim" data-close="#recv"></div>';
      return page('Sửa chữa','Phiếu nhận · thợ · báo giá',body,{mAct:'<button class="rb dk" data-open="#recv">'+ic('plus',20)+'</button>',acts:'<button class="btn lm" data-open="#recv">'+ic('plus',18)+' Nhận máy mới</button>'});
    },
    cash:function(){
      var tot=WF.funds.reduce(function(s,f){return s+f.bal;},0), tn=['mint','sky','lil'];
      var body='<div class="bw"><div class="span12"><div class="t ink" style="margin-bottom:12px"><div class="lb">Tổng tiền các quỹ</div><div class="n" style="font-size:38px">'+vnd(tot)+'</div><div class="sb">Thực thu hôm nay '+WF.short(33400000)+' · thực chi '+WF.short(1850000)+'</div><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn lm sm" data-toast="Phiếu thu">'+ic('plus',16)+' Thu</button><button class="btn sm" data-toast="Phiếu chi">'+ic('minus',16)+' Chi</button><button class="btn sm" data-toast="Chuyển quỹ">'+ic('swap',16)+' Chuyển quỹ</button><button class="btn sm" data-toast="Chốt ngày">'+ic('check',16)+' Chốt ngày</button></div></div></div></div>'+
      '<div class="fl" style="margin-bottom:12px">'+WF.funds.map(function(f,i){return '<div class="fund '+tn[i]+'"><i>'+ic(f.ic,18)+'</i><div><small>'+f.name+' '+(f.sub==='Quỹ tiền mặt'?'':f.sub)+'</small><b>'+WF.short(f.bal)+'</b></div></div>';}).join('')+'<div class="fund lem"><i>'+ic('users',18)+'</i><div><small>Khách nợ / Nợ NCC</small><b>'+WF.short(k.debtIn)+' / '+WF.short(k.debtOut)+'</b></div></div></div>'+
      '<div data-tabs><div class="tabs"><button class="on" data-tab="a">Sổ quỹ</button><button data-tab="b">Khách nợ</button><button data-tab="c">Nợ nhà cung cấp</button></div>'+
      '<div data-pane="a" class="on t wht">'+WF.ledger.map(function(l){return '<div class="lg"><div class="ic3" data-tone="'+(l.dir==='in'?'ok':'bad')+'">'+ic(l.dir==='in'?'arrowDR':'arrowUR',18)+'</div><div class="tx"><b>'+l.title+'</b><span>'+l.d+' '+l.t+' · '+l.fund+'</span></div><div class="a '+l.dir+'">'+(l.dir==='in'?'+':'−')+WF.num(l.amt)+'</div></div>';}).join('')+'</div>'+
      ['customers','suppliers'].map(function(kind,ix){return '<div data-pane="'+(ix?'c':'b')+'" class="t wht">'+WF.debts[kind].map(function(d){return '<div class="lg"><div class="ic3" data-tone="'+(d.left<5?'bad':'hold')+'" style="font-weight:800;font-size:13px">'+WF.initials(d.name)+'</div><div class="tx"><b>'+d.name+'</b><span>'+d.ref+' · hạn '+d.due+' · '+(d.left<5?'<span data-neg>còn '+d.left+' ngày</span>':'còn '+d.left+' ngày')+'</span></div><div style="text-align:right"><div class="a">'+WF.num(d.amt)+'</div><button class="g-btn" style="margin-top:4px" data-toast="'+(ix?'Trả nợ NCC':'Thu nợ')+'">'+(ix?'Trả nợ':'Thu nợ')+'</button></div></div>';}).join('')+'</div>';}).join('')+'</div>';
      return page('Thu chi','Quỹ · sổ quỹ · công nợ',body,{mAct:'<button class="rb dk" data-toast="Phiếu thu">'+ic('plus',20)+'</button>',acts:'<button class="btn lm" data-toast="Phiếu thu">'+ic('plus',18)+' Phiếu thu</button><button class="btn" data-toast="Phiếu chi">'+ic('minus',18)+' Phiếu chi</button>'});
    },
    report:function(){
      var body='<div class="seg"><button>Hôm nay</button><button>7 ngày</button><button class="on">Tháng này</button><button>Năm</button></div>'+
      '<div class="bento hm2" style="grid-auto-rows:auto"><div class="t ink s2 span8"><div class="th2"><h3>Doanh thu & lãi gộp</h3><a data-toast="Xuất Excel">Excel</a></div><div class="legend"><span><i style="background:#C8F25C"></i>Doanh thu</span><span><i style="background:#FF8FA9"></i>Lãi gộp</span></div><div style="height:190px">'+WF.chart.area([S.rev16,S.profit16],{w:600,h:190,colors:['#C8F25C','#FF8FA9'],fillOp:.25,grid:false,sw:3})+'</div></div>'+
      '<div class="t lil span4"><div class="th2"><h3>Theo thương hiệu</h3></div><div style="display:flex;align-items:center;gap:14px">'+WF.chart.donut([{v:34,color:'#6B52F0'},{v:22,color:'#13935F'},{v:18,color:'#E8561C'},{v:14,color:'#2A78E0'},{v:12,color:'#D8355F'}],{size:104,th:18,gap:3,track:'rgba(255,255,255,.6)'})+'<div style="font-size:12px;display:grid;gap:6px;flex:1">'+[['#6B52F0','Omega · Rolex 34%'],['#13935F','Seiko 22%'],['#E8561C','Tissot 18%'],['#2A78E0','Longines 14%'],['#D8355F','Khác 12%']].map(function(x){return '<div style="display:flex;gap:8px;align-items:center"><i style="width:9px;height:9px;border-radius:50%;background:'+x[0]+'"></i><b style="font-weight:700">'+x[1]+'</b></div>';}).join('')+'</div></div></div>'+
      '<div class="t mint s2 span5"><div class="th2"><h3>Danh mục báo cáo</h3></div>'+[['R1','Doanh thu'],['R2','Lợi nhuận gộp'],['R3','Nhập & xuất hàng'],['R4','Tồn kho theo giá vốn'],['R5','Hàng tồn lâu ngày'],['R6','Công nợ khách & NCC'],['R7','Doanh thu sửa & công thợ'],['R8','Thu chi & số dư']].map(function(r){return '<div class="rowi" data-toast="Mở báo cáo '+r[1]+'" style="cursor:pointer"><b style="color:var(--mint2);min-width:30px">'+r[0]+'</b><div class="tx"><b>'+r[1]+'</b></div>'+ic('chevR',16)+'</div>';}).join('')+'</div>'+
      '<div class="t wht s2 span7"><div class="th2"><h3>Tuần</h3></div><table style="width:100%;border-collapse:collapse;font-size:13.5px">'+[['1–7/10','9','155,3 tr','37,7 tr'],['8–14/10','11','215,7 tr','52,5 tr'],['15–16/10','4','115,3 tr','28,2 tr'],['Tổng','24',WF.short(k.revMonth),WF.short(k.profit)]].map(function(r,i){return '<tr style="border-bottom:1px dashed rgba(23,23,28,.12);'+(i===3?'font-weight:800':'')+'"><td style="padding:12px 0">'+r[0]+'</td><td>'+r[1]+' phiếu</td><td style="text-align:right">'+r[2]+'</td><td style="text-align:right;color:var(--mint2);font-weight:700">'+r[3]+'</td></tr>';}).join('')+'</table></div></div>';
      return page('Báo cáo','Doanh thu · lãi gộp · tồn kho',body,{mAct:'<button class="rb dk" data-toast="Xuất Excel">'+ic('download',20)+'</button>',acts:'<button class="btn" data-toast="Xuất Excel">'+ic('download',18)+' Excel</button><button class="btn" data-toast="Xuất PDF">'+ic('file',18)+' PDF</button>'});
    }
  };
  var gen={buy:['Nhập hàng','Phiếu nhập · thu mua','purchases','<button class="btn dk" data-toast="Tạo phiếu nhập">'+ic('plus',18)+' Phiếu nhập</button>'],cust:['Khách hàng','Mua hàng · công nợ','customers','<button class="btn dk" data-toast="Thêm khách">'+ic('plus',18)+' Thêm khách</button>'],reserve:['Giữ hàng','Cọc không phải doanh thu','reserve',''],returns:['Đổi trả','Hoàn tiền có kiểm soát','returns',''],parts:['Linh kiện','Tồn · cảnh báo','parts','<button class="btn dk" data-toast="Nhập linh kiện">'+ic('plus',18)+' Nhập linh kiện</button>'],stocktake:['Kiểm kê','Đối chiếu tồn thực tế','stocktake',''],collab:['Cộng tác viên','Bán hộ ăn hoa hồng','collab',''],admin:['Quản trị','Người dùng · sao lưu · nhật ký','admin',''],sales:['Phiếu bán','Lịch sử hóa đơn','sales','<button class="btn dk" data-go="pos">'+ic('plus',18)+' Bán hàng</button>']};
  Object.keys(gen).forEach(function(id){var g=gen[id];screens[id]=function(){return page(g[0],g[1],'<div class="'+(id==='admin'?'g-grid2':'')+'">'+WF.pages[g[2]]()+'</div>',{acts:g[3],mAct:'<button class="rb" data-toast="Thông báo">'+ic('bell',20)+'</button>'});};});

  function renderCart(){
    var cart=$('#cart'); if(!cart) return; var lines=C.lines(), t=C.total();
    cart.innerHTML='<div class="grab"></div><h3><span>Phiếu HD-1016-004</span><button class="xb" data-close="#cart" style="opacity:.6">'+ic('x',22)+'</button></h3><div class="cust" data-toast="Chọn / tạo nhanh khách"><div>Khách lẻ<span>Chạm để chọn khách hàng</span></div>'+ic('chevR',18)+'</div>'+
      (lines.length?lines.map(function(l){return '<div class="cl"><div class="c">'+(l.w?WF.img(l.w,{crop:'head'}):ic(l.ic,20))+'</div><div class="tx"><b>'+l.name+'</b><span>'+l.sub+'</span></div>'+(l.kind==='acc'?'<div class="qty"><button data-inc="'+l.id+'" data-d="-1">'+ic('minus',14)+'</button><span>'+l.q+'</span><button data-inc="'+l.id+'" data-d="1">'+ic('plus',14)+'</button></div>':'')+'<div class="p">'+WF.num(l.price*l.q)+'</div><button class="rm" data-rm="'+l.id+'">'+ic('x',16)+'</button></div>';}).join(''):'<p style="padding:28px 0;text-align:center;opacity:.6">Chưa có món nào. Chọn đồng hồ hoặc quét QR.</p>')+
      '<div class="sum"><div><span>Tạm tính</span><b>'+vnd(C.sub())+'</b></div><div><span>Giảm giá (tối đa 5%)</span><b>−'+WF.num(C.discount)+'</b></div><div data-toast="Thêm máy cũ — thu cũ đổi mới" style="cursor:pointer"><span>Thu cũ đổi mới</span><b style="color:var(--lime)">+ Thêm máy cũ</b></div><div class="tot"><span>Tổng phải trả</span><b>'+vnd(t)+'</b></div></div>'+
      '<div class="pills"><button data-method="cash" class="'+(WF.pay.method==='cash'?'on':'')+'">Tiền mặt</button><button data-method="bank" class="'+(WF.pay.method==='bank'?'on':'')+'">Chuyển khoản</button><button data-method="mix" class="'+(WF.pay.method==='mix'?'on':'')+'">Kết hợp</button></div><label class="recv"><span>Khách đưa</span><input data-recv inputmode="numeric" value="'+WF.num(WF.pay.val())+'"></label><div class="calc" data-calc>'+WF.pay.html()+'</div>'+
      '<button class="btn lm block" style="height:54px;font-size:15px'+(lines.length?'':';opacity:.45')+'" data-toast="Đã xác nhận phiếu — in phiếu bán">Xác nhận & in phiếu</button>';
    var bar=$('#cartbar'); if(bar) bar.innerHTML='<div class="t2"><small>'+C.count()+' món · phiếu nháp</small><b>'+vnd(t)+'</b></div><button class="btn dk sm" data-open="#cart" style="height:44px">Xem phiếu</button>';
    WF.$$('.wt i[data-add]').forEach(function(b){b.classList.toggle('in',C.has(b.dataset.add));});
  }
  WF.app({view:'#view',screens:screens,home:'home',onRoute:function(id){
    var key=id==='unit'?'stock':id==='sales'?'pos':id;
    WF.$$('#rail a[data-go], #dock a[data-go]').forEach(function(a){a.classList.toggle('on',a.dataset.go===key);});
    var mn=$('#dock a[data-open]'); if(mn) mn.classList.toggle('on',['home','stock','pos','repair'].indexOf(key)<0);
    $('#ov').classList.remove('open'); $('#qs').classList.remove('open');
    var f=$('.fab'); if(f) f.style.display=(id==='pos'||id==='unit')?'none':'';
    if(id==='pos'){WF.pay.reset();C.cb=renderCart;renderCart();}else C.cb=null;
  }});
})();
</script>
