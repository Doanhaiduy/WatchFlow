<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WatchFlow · Mẫu 6 — Glass</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1B3A;--mute:#6E7194;--ind:#5B5BF0;--ind2:#7C9BFF;--g:rgba(255,255,255,.58);--gb:rgba(255,255,255,.82);--gs:0 10px 32px rgba(91,91,240,.11),inset 0 1px 0 rgba(255,255,255,.95);
  --ok:#17A673;--okt:rgba(23,166,115,.14);--bad:#E5484D;--badt:rgba(229,72,77,.13);--hold:#D98A00;--holdt:rgba(240,170,20,.2);--info:#3B82F6;--infot:rgba(59,130,246,.14);--chk:#8B5CF6;--chkt:rgba(139,92,246,.14);--rep:#F0742A;--rept:rgba(240,116,42,.15);
}
*{box-sizing:border-box;margin:0}
html{background:#EEF1FB}
body{font:400 14px/1.5 'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;position:relative;background:#EEF1FB}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(55% 45% at 8% 0%,#BCD6FF 0%,transparent 70%),radial-gradient(50% 42% at 100% 8%,#E3D2FF 0%,transparent 70%),radial-gradient(60% 50% at 90% 100%,#FFD8C8 0%,transparent 70%),radial-gradient(50% 50% at 0% 95%,#CDEFE3 0%,transparent 70%),#EEF1FB}
html.framed body::after{content:'';position:fixed;top:0;left:0;right:0;height:var(--safe-top);background:linear-gradient(#DDE7FF,rgba(221,231,255,.0));z-index:90;pointer-events:none}
button{background:none;border:0}a{color:inherit;text-decoration:none}
.only-d{display:none}
.g{background:var(--g);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--gb);box-shadow:var(--gs);border-radius:26px}

[data-tone=ok]{--tc:var(--ok);--tb:var(--okt)}[data-tone=bad]{--tc:var(--bad);--tb:var(--badt)}[data-tone=hold]{--tc:var(--hold);--tb:var(--holdt)}[data-tone=info]{--tc:var(--info);--tb:var(--infot)}[data-tone=check]{--tc:var(--chk);--tb:var(--chkt)}[data-tone=repair]{--tc:var(--rep);--tb:var(--rept)}[data-tone=sold],[data-tone=draft]{--tc:#6E7194;--tb:rgba(110,113,148,.14)}
.wf-chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--tb);color:var(--tc);white-space:nowrap;line-height:1.4}

/* large title header */
.lt{padding:calc(18px + var(--safe-top)) 20px 8px}
.lt .row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.lt small{color:var(--mute);font-size:13px;font-weight:500;flex:1}
.lt h1{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.cb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative;cursor:pointer;color:var(--ink)}
.cb .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid #fff}
.pg{padding:8px 14px calc(124px + var(--safe-bottom))}
.stack>*+*{margin-top:12px}

/* dock */
.dock{position:fixed;left:16px;right:16px;bottom:calc(14px + var(--safe-bottom));z-index:60;height:70px;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center;padding:0 6px;border-radius:36px}
.dock a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#8B8FB3;font-size:10.5px;font-weight:600;cursor:pointer;position:relative}
.dock a.on{color:var(--ind)}
.dock a.on::after{content:'';position:absolute;bottom:-8px;width:5px;height:5px;border-radius:50%;background:var(--ind)}
.dock a.plus{margin-top:-30px}
.dock a.plus i{width:62px;height:62px;border-radius:50%;background:linear-gradient(145deg,#8E7CFF,#4C7DFF);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(255,255,255,.55),0 12px 30px rgba(91,91,240,.55),0 0 36px rgba(124,155,255,.7)}
.dock a.plus::after{display:none}
.as{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-bottom));z-index:96;transform:translateY(130%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.as.open{transform:none}.as.open~.scrim{opacity:1;pointer-events:auto}
.scrim{position:fixed;inset:0;background:rgba(27,27,58,.3);backdrop-filter:blur(3px);z-index:92;opacity:0;pointer-events:none;transition:.25s}
.as .grp{overflow:hidden;border-radius:22px;background:rgba(255,255,255,.86);backdrop-filter:blur(30px);margin-bottom:8px}
.as .grp a{display:flex;align-items:center;gap:14px;padding:15px 18px;font-weight:600;font-size:16px;border-bottom:1px solid rgba(27,27,58,.08);cursor:pointer}.as .grp a:last-child{border:0}
.as .grp a i{width:36px;height:36px;border-radius:12px;background:var(--tb);color:var(--tc);display:grid;place-items:center}
.as .cancel{background:rgba(255,255,255,.95);border-radius:22px;text-align:center;padding:15px;font-weight:700;color:var(--ind);font-size:16px;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:95;background:linear-gradient(180deg,#E9EEFF,#F4EEFF);transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);overflow:auto;padding:calc(16px + var(--safe-top)) 16px 40px}
.sheet.open{transform:none}

/* hero wallet */
.wallet{background:linear-gradient(140deg,#6C63FF 0%,#5B8DFF 60%,#8CC0FF 100%);color:#fff;border-radius:30px;padding:20px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(91,91,240,.35)}
.wallet::before{content:'';position:absolute;right:-50px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%)}
.wallet::after{content:'';position:absolute;left:-40px;bottom:-80px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%)}
.wallet .l{font-size:13px;opacity:.85;display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.wallet .n{font-size:34px;font-weight:800;letter-spacing:-.04em;margin:4px 0 10px;line-height:1.1;position:relative;z-index:1}
.wallet .n small{font-size:17px;font-weight:600;opacity:.8}
.wallet .pb{height:8px;background:rgba(255,255,255,.28);border-radius:4px;overflow:hidden;position:relative;z-index:1}.wallet .pb i{display:block;height:100%;border-radius:4px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.8)}
.wallet .pr{display:flex;justify-content:space-between;font-size:12px;opacity:.9;margin:8px 0 14px;position:relative;z-index:1}
.wallet .wbtn{position:absolute;right:18px;top:18px;z-index:2;background:#15153A;color:#fff;font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:999px;cursor:pointer}
.wallet .tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.wallet .tri div{background:rgba(255,255,255,.2);border-radius:16px;padding:10px 12px;backdrop-filter:blur(6px)}
.wallet .tri span{display:block;font-size:11px;opacity:.85}.wallet .tri b{font-size:18px;font-weight:700}
.chartc{padding:16px}
.seg{display:flex;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;padding:8px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--mute);white-space:nowrap}
.seg .on{background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(91,91,240,.15)}
.cw{position:relative;height:170px;margin-top:12px;color:#8B8FB3}
.tip{position:absolute;transform:translate(-50%,-135%);background:#15153A;color:#fff;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:10px;white-space:nowrap;pointer-events:none}
.tip::after{content:'';position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:#15153A;transform:translateX(-50%) rotate(45deg)}
.tdot{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--ind);transform:translate(-50%,-50%);box-shadow:0 0 0 5px rgba(91,91,240,.2)}
.tline{position:absolute;top:0;bottom:0;width:0;border-left:1.5px dashed rgba(91,91,240,.4)}
.xl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute);margin-top:8px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 8px 10px}.sec h3{font-size:18px;font-weight:700;letter-spacing:-.02em}.sec a{font-size:13px;font-weight:600;color:var(--ind);cursor:pointer}

/* inset list */
.ig{border-radius:24px;overflow:hidden}
.ir{display:flex;align-items:center;gap:12px;padding:13px 16px;position:relative;cursor:pointer}
.ir+.ir::before{content:'';position:absolute;top:0;left:72px;right:0;height:1px;background:rgba(27,27,58,.07)}
.ir.nol+.ir::before{left:16px}
.ir .ib{width:44px;height:44px;border-radius:14px;background:var(--tb,rgba(91,91,240,.12));color:var(--tc,var(--ind));display:grid;place-items:center;flex:none;font-weight:700}
.ir .th{width:48px;height:48px;border-radius:15px;background:linear-gradient(160deg,#fff,#E4E9FF);padding:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9)}
.ir .m{flex:1;min-width:0}.ir .m b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ir .m span{font-size:12px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir .e{text-align:right;flex:none}.ir .e b{display:block;font-weight:700;font-size:14.5px}
.ir .cv{color:#B0B3D0}

.sbar{display:flex;gap:10px;margin-bottom:12px}
.sbar label{flex:1;display:flex;align-items:center;gap:10px;height:48px;border-radius:999px;padding:0 16px;color:var(--mute);min-width:0}
.sbar input{flex:1;border:0;outline:0;background:none;font:500 15px 'Be Vietnam Pro';color:var(--ink);min-width:0}
.sbar .cb{width:48px;height:48px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px}.chips::-webkit-scrollbar{display:none}
.g-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px}.g-chips::-webkit-scrollbar{display:none}
.g-chip,.chips button{padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);cursor:pointer}
.g-chip.on,.chips button.on{background:var(--ind);color:#fff;border-color:var(--ind);box-shadow:0 6px 16px rgba(91,91,240,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;font-weight:600;font-size:14px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn.pri{background:linear-gradient(135deg,#6C63FF,#5B8DFF);color:#fff;border:0;box-shadow:0 10px 24px rgba(91,91,240,.4)}
.btn.dk{background:#15153A;color:#fff;border:0}.btn.block{width:100%}.btn.sm{height:36px;padding:0 14px;font-size:13px}

/* product cards */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{padding:10px;cursor:pointer;display:flex;flex-direction:column;position:relative;border-radius:24px}
.pc .im{aspect-ratio:1;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.95),rgba(214,224,255,.7));padding:6% 16%;position:relative}
.pc .im .st{position:absolute;top:8px;left:8px}
.pc b{font-size:13px;font-weight:600;line-height:1.3;margin-top:8px;min-height:34px}.pc small{font-size:11px;color:var(--mute)}
.pc .pr{display:flex;align-items:center;justify-content:space-between;margin-top:6px}.pc .pr strong{font-size:15px;font-weight:800;letter-spacing:-.02em}
.pc .ad{width:32px;height:32px;border-radius:50%;background:rgba(91,91,240,.14);color:var(--ind);display:grid;place-items:center}.pc .ad.in{background:var(--ind);color:#fff}

/* unit */
.unit{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.uimg{border-radius:32px;aspect-ratio:1;padding:7% 22%;position:relative;overflow:hidden}
.uimg .st{position:absolute;left:14px;top:14px}.uimg .back{position:absolute;right:14px;top:14px}
.uimg::before{content:'';position:absolute;left:50%;top:48%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),transparent 68%)}
.uimg .wf-img{position:relative}
.uinfo{padding:18px}
.uinfo h1{font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.2}.uinfo .pr{font-size:30px;font-weight:800;letter-spacing:-.04em;color:var(--ind);margin:6px 0 2px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.acts button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:20px;background:rgba(255,255,255,.7);font-size:12px;font-weight:600;cursor:pointer}
.acts button.pri{background:linear-gradient(135deg,#6C63FF,#5B8DFF);color:#fff;box-shadow:0 10px 22px rgba(91,91,240,.35)}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(27,27,58,.07);font-size:13.5px}.kv div:last-child{border:0}.kv span{color:var(--mute)}.kv b{font-weight:600;text-align:right}
.lock{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);margin-top:10px;padding:10px 12px;background:var(--holdt);border-radius:14px}
.tl{list-style:none;padding:0}.tl li{position:relative;padding:0 0 14px 22px}.tl li::before{content:'';position:absolute;left:0;top:5px;width:10px;height:10px;border-radius:50%;background:var(--ind);box-shadow:0 0 0 4px rgba(91,91,240,.18)}.tl li::after{content:'';position:absolute;left:4px;top:18px;bottom:0;width:2px;background:rgba(27,27,58,.08)}.tl li:last-child::after{display:none}.tl li b{display:block;font-weight:600}.tl li span{font-size:12px;color:var(--mute)}

/* POS */
.pos{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.cartbar{position:fixed;left:16px;right:16px;bottom:calc(96px + var(--safe-bottom));z-index:55;border-radius:999px;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 20px}
.cartbar .t2{flex:1}.cartbar small{display:block;color:var(--mute);font-size:11.5px}.cartbar b{font-size:18px;font-weight:800;letter-spacing:-.02em}
.cart{position:fixed;left:0;right:0;bottom:0;z-index:96;background:rgba(246,247,255,.92);backdrop-filter:blur(30px);border-radius:32px 32px 0 0;padding:12px 18px calc(24px + var(--safe-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-height:93vh;overflow:auto;box-shadow:0 -20px 60px rgba(91,91,240,.2)}
.cart.open{transform:none}.cart.open~.scrim{opacity:1;pointer-events:auto}
.gb{width:40px;height:5px;border-radius:3px;background:#CBCDE6;margin:0 auto 12px}
.cart h3{font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.cl{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(27,27,58,.07)}
.cl .th{width:48px;height:48px;border-radius:15px;background:linear-gradient(160deg,#fff,#E4E9FF);padding:3px;flex:none;display:grid;place-items:center;color:var(--ind)}
.cl .tx{flex:1;min-width:0}.cl .tx b{display:block;font-weight:600;font-size:13.5px}.cl .tx span{font-size:11.5px;color:var(--mute)}
.cl .p{font-weight:700;min-width:76px;text-align:right}.cl .rm{color:var(--mute);padding:4px}
.qty{display:flex;align-items:center;background:rgba(91,91,240,.1);border-radius:999px;height:30px}.qty button{width:28px;height:30px;display:grid;place-items:center}.qty span{min-width:18px;text-align:center;font-weight:600}
.sum div{display:flex;justify-content:space-between;padding:7px 0;color:var(--mute)}.sum div b{color:var(--ink);font-weight:600}
.sum .tot{border-top:1px dashed rgba(27,27,58,.15);margin-top:6px;padding-top:12px;color:var(--ink);font-weight:600;align-items:baseline}.sum .tot b{font-size:28px;font-weight:800;letter-spacing:-.04em;color:var(--ind)}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.pills button{height:42px;border-radius:999px;background:rgba(255,255,255,.7);font-weight:600;font-size:13px;color:var(--mute)}.pills button.on{background:var(--ink);color:#fff}
.recv{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.8);border-radius:20px;padding:10px 16px;margin-bottom:6px}.recv span{font-size:12px;color:var(--mute)}.recv input{flex:1;border:0;background:none;text-align:right;font:800 24px 'Be Vietnam Pro';outline:0;min-width:0;letter-spacing:-.03em;color:var(--ink)}
.calc{display:flex;justify-content:space-between;font-size:13px;padding:4px 6px 14px;color:var(--mute)}.calc b{font-weight:700}.calc .ok{color:var(--ok)}.calc .bad{color:var(--bad)}
.cust{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.75);padding:12px 16px;border-radius:20px;margin:10px 0;cursor:pointer;font-weight:600}.cust span{display:block;font-weight:400;color:var(--mute);font-size:12px}

/* repair */
.rcd{padding:16px;display:flex;gap:14px;align-items:center}
.rcd .ringc{position:relative;flex:none;display:grid;place-items:center}.rcd .ringc b{position:absolute;font-size:12px;font-weight:700}
.rcd .m{flex:1;min-width:0}.rcd .m .tp{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);font-weight:600;margin-bottom:2px}.rcd .m h4{font-size:15.5px;font-weight:700;letter-spacing:-.01em;line-height:1.3}.rcd .m p{font-size:12px;color:var(--mute);margin-top:2px;line-height:1.4}
.rcd .ft{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--mute)}.rcd .ft b{color:var(--ink);font-weight:800;font-size:14px}
.rcg{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.stp{display:flex;gap:6px;margin-bottom:14px}.stp button{flex:1;height:34px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.6);color:var(--mute)}.stp button.on{background:var(--ind);color:#fff}
.fld{display:block;margin-bottom:12px}.fld span{display:block;font-size:12px;color:var(--mute);font-weight:600;margin:0 0 4px 6px}.fld input,.fld textarea{width:100%;border:1px solid rgba(255,255,255,.9);border-radius:20px;background:rgba(255,255,255,.75);padding:13px 16px;font:500 15px 'Be Vietnam Pro';outline:0}
.modal{position:fixed;left:0;right:0;bottom:0;z-index:96;background:rgba(246,247,255,.94);backdrop-filter:blur(30px);border-radius:32px 32px 0 0;padding:12px 18px calc(24px + var(--safe-bottom));transform:translateY(105%);transition:.35s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto}.modal.open{transform:none}.modal.open~.scrim{opacity:1;pointer-events:auto}.modal h3{font-size:20px;font-weight:800;margin-bottom:10px}

/* cash */
.wacts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px;position:relative;z-index:1}
.wacts button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#fff;cursor:pointer}
.wacts i{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.24);display:grid;place-items:center;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.4)}
.fl{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:12px -14px 0;padding:0 14px 4px}.fl::-webkit-scrollbar{display:none}
.fc{flex:none;width:170px;padding:14px;border-radius:24px}.fc i{width:36px;height:36px;border-radius:12px;background:var(--tb);color:var(--tc);display:grid;place-items:center;font-style:normal}.fc small{display:block;color:var(--mute);font-size:12px;margin-top:10px;font-weight:500}.fc b{font-size:20px;font-weight:800;letter-spacing:-.03em}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute)}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}

/* generic */
.g-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.g-kpi{padding:12px;border-radius:20px;background:var(--g);backdrop-filter:blur(20px);border:1px solid var(--gb);box-shadow:var(--gs)}
.g-kpi span{display:block;font-size:11px;color:var(--mute);font-weight:500;line-height:1.3;min-height:28px}.g-kpi b{font-size:18px;font-weight:800;letter-spacing:-.03em;display:block;margin-top:3px}.g-kpi em{font-style:normal;font-size:10.5px;color:var(--mute)}

<script>
(function(){
  var $=WF.$, ic=WF.icon, vnd=WF.vnd, k=WF.kpi, S=WF.series, C=WF.cart;
  var TN=['info','ok','hold','check','repair','bad','info','ok','hold','check','repair','bad','info','ok'];

  $('#isl').innerHTML='<div class="brand"><i>'+ic('watch',22,2)+'</i><div>WatchFlow<small>Minh Châu Watch</small></div></div>'+groups.map(function(g){return '<h6>'+g[0]+'</h6>'+g[1].map(function(id){var m=WF.module$(id);return '<a data-go="'+id+'">'+ic(m.ic,19,1.7)+'<span>'+m.label.replace(' & công nợ','')+'</span></a>';}).join('');}).join('')+'<div class="me"><i>M</i><div><b>Anh Minh</b><small>Chủ cửa hàng</small></div></div>';
  $('#dock').innerHTML='<a data-go="home">'+ic('home',23,1.7)+'<span>Tổng quan</span></a><a data-go="stock">'+ic('watch',23,1.7)+'<span>Đồng hồ</span></a><a class="plus" data-open="#as"><i>'+ic('plus',30,2.2)+'</i></a><a data-go="cash">'+ic('wallet',23,1.7)+'<span>Thu chi</span></a><a data-open="#sheet">'+ic('menu',23,1.7)+'<span>Menu</span></a>';
  $('#as').innerHTML='<div class="grp"><a data-go="pos" data-tone="info"><i>'+ic('cart',20)+'</i>Bán hàng</a><a data-go="buy" data-tone="ok"><i>'+ic('truck',20)+'</i>Nhập hàng</a><a data-go="repair" data-tone="repair"><i>'+ic('wrench',20)+'</i>Nhận máy sửa</a><a data-go="cash" data-tone="check"><i>'+ic('wallet',20)+'</i>Thu / Chi</a><a data-go="reserve" data-tone="hold"><i>'+ic('tag',20)+'</i>Giữ hàng / đặt cọc</a></div><div class="cancel" data-close="#as">Hủy</div>';
  $('#sheet').innerHTML='<div style="display:flex;align-items:center;margin-bottom:12px"><h1 style="flex:1;font-size:32px;font-weight:800;letter-spacing:-.035em">Menu</h1><button class="cb g" data-close="#sheet">'+ic('x',20)+'</button></div>'+groups.map(function(g){return '<div class="sec" style="margin:16px 8px 8px"><h3 style="font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em">'+g[0]+'</h3></div><div class="g ig">'+g[1].map(function(id,i){var m=WF.module$(id);return '<a class="ir" data-go="'+id+'" data-tone="'+TN[i%6]+'"><span class="ib">'+ic(m.ic,21)+'</span><div class="m"><b>'+m.label+'</b></div><span class="cv">'+ic('chevR',18)+'</span></a>';}).join('')+'</div>';}).join('');

  function chipSt(s){var m=WF.statusMeta[s];return WF.chip(m.label,m.tone);}
  function page(title,sub,body,o){o=o||{};
    return '<div class="lt only-m"><div class="row"><small>'+(sub||'')+'</small>'+(o.mAct||'<button class="cb g" data-toast="3 thông báo mới"><span class="dot"></span>'+ic('bell',20)+'</button>')+'</div><h1>'+title+'</h1></div>'+
    '<div class="tb g only-d"><h1>'+title+'</h1><small>'+(sub||'')+'</small><div class="sp"></div><label class="s">'+ic('search',18)+'<input placeholder="Tìm kiếm nhanh…"></label>'+(o.acts||'')+'<button class="cb" style="background:rgba(255,255,255,.7)" data-toast="3 thông báo mới"><span class="dot"></span>'+ic('bell',20)+'</button></div><div class="pg">'+body+'</div>';
  }
  function costParts(w){var rep=w.cg==='refurb'?1650000:0;return {base:w.cost-200000-rep,ship:120000,insp:80000,rep:rep};}
  function pcard(w,add){return '<div class="pc g" data-cat="'+(add?w.cg:w.st)+'" '+(add?'data-add="'+w.id+'"':'data-go="unit" data-id="'+w.id+'"')+'><div class="im">'+(add?'':'<span class="st">'+chipSt(w.st)+'</span>')+WF.img(w)+'</div><b>'+w.brand+' '+w.model+'</b><small>'+w.id+' · '+w.cond+'</small><div class="pr"><strong>'+WF.short(w.price)+'</strong><span class="ad" '+(add?'data-add="'+w.id+'"':'')+'>'+ic(add?'plus':'arrowUR',16)+'</span></div></div>';}
  function tipChart(series,idx,tipText,o){var sc=WF.chart.scale(series,{w:400,h:170,pad:6}),x=sc.x(idx)/sc.w*100,y=sc.y(series[0][idx])/sc.h*100;
    return '<div class="cw">'+WF.chart.area(series,o)+'<div class="tline" style="left:'+x+'%"></div><div class="tdot" style="left:'+x+'%;top:'+y+'%"></div><div class="tip" style="left:'+x+'%;top:'+y+'%">'+tipText+'</div></div>';}

  var screens={
    home:function(){
      var wallet='<div class="wallet"><div class="l">'+ic('wallet',16)+' Doanh thu tháng 10</div><button class="wbtn" data-go="report">Xem báo cáo</button><div class="n">'+WF.num(k.revMonth)+'<small> ₫</small></div><div class="pb"><i style="width:78%"></i></div><div class="pr"><span>78% mục tiêu tháng (620 tr)</span><span>▲ 12,4% so T9</span></div><div class="tri"><div><span>Đồng hồ tồn</span><b>'+k.stockCount+'</b></div><div><span>Đã bán T10</span><b>'+k.sold+'</b></div><div><span>Đang sửa</span><b>8</b></div></div></div>';
      var chart='<div class="g chartc"><div class="seg" data-tabs><button class="on" data-tab="a">Doanh thu</button><button data-tab="b">Lãi gộp</button><button data-tab="c">Thực thu</button></div>'+tipChart([S.rev16],14,'60,5 tr · 15/10',{w:400,h:170,colors:['#5B5BF0'],fillOp:.32,sw:2.8,dash:true})+'<div class="xl">'+['1/10','4/10','7/10','10/10','13/10','16/10'].map(function(x){return '<span>'+x+'</span>';}).join('')+'</div></div>';
      var tasks='<div class="g ig">'+WF.tasks.slice(0,5).map(function(t){return '<div class="ir" data-go="'+t.go+'" data-tone="'+t.tone+'"><span class="ib">'+ic(t.ic,20)+'</span><div class="m"><b>'+t.title+'</b><span>'+t.sub+'</span></div><span class="wf-chip" data-tone="'+t.tone+'">'+t.n+'</span></div>';}).join('')+'</div>';
      var orders='<div class="g ig">'+WF.sales.slice(0,4).map(function(s){var w=s.w&&WF.watch$(s.w),st=WF.saleState[s.state];return '<div class="ir" data-go="sales">'+(w?'<span class="th">'+WF.img(w,{crop:'head'})+'</span>':'<span class="ib">'+ic('receipt',20)+'</span>')+'<div class="m"><b>'+s.cust+'</b><span>'+s.items.split(' + ')[0]+' · '+s.time+'</span></div><div class="e"><b>'+WF.short(s.total)+'</b>'+WF.chip(st[0],st[1])+'</div></div>';}).join('')+'</div>';
      var reps='<div class="g ig">'+WF.repairs.filter(function(r){return r.st!=='delivered';}).slice(0,4).map(function(r){var m=WF.repairMeta[r.st];return '<div class="ir" data-go="repair" data-tone="'+m.tone+'"><span class="ib">'+ic('wrench',20)+'</span><div class="m"><b>'+r.watch+'</b><span>'+r.code+' · '+r.tech+' · hẹn '+r.due+'</span></div>'+WF.chip(m.label,m.tone)+'</div>';}).join('')+'</div>';
      var mob='<div class="lt only-m"><div class="row"><small>Thứ Sáu, 16/10 · Minh Châu Watch</small><button class="cb g" data-toast="Quét QR">'+ic('scan',20)+'</button><button class="cb g" data-toast="3 thông báo mới"><span class="dot"></span>'+ic('bell',20)+'</button></div><h1>Chào anh Minh 👋</h1></div><div class="pg only-m"><div class="stack">'+wallet+chart+'</div><div class="sec"><h3>Việc cần xử lý</h3></div>'+tasks+'<div class="sec"><h3>Đơn hàng mới nhất</h3><a data-go="sales">Tất cả</a></div>'+orders+'<div class="sec"><h3>Đang sửa chữa</h3><a data-go="repair">Tất cả</a></div>'+reps+'</div>';
      var kt='<div class="kt">'+[['info','trendup','Lãi gộp',WF.short(k.profit),'▲ 8,1% · biên 24,3%'],['ok','wallet','Thực thu',WF.short(k.cashIn),'chi '+WF.short(k.cashOut)],['hold','watch','Giá trị tồn (vốn)',WF.short(k.stockValue),k.stockCount+' chiếc'],['check','receipt','Hôm nay',WF.short(k.revToday),'3 phiếu bán']].map(function(x){return '<div class="g" data-tone="'+x[0]+'"><div class="l"><i>'+ic(x[1],17)+'</i>'+x[2]+'</div><b>'+x[3]+'</b><em>'+x[4]+'</em></div>';}).join('')+'</div>';
      var wg='<div class="wcol"><div class="g wgt"><h3>Việc cần xử lý <a data-toast="6 việc">6</a></h3>'+WF.tasks.map(function(t,i){return '<div class="ag" data-go="'+t.go+'" data-tone="'+t.tone+'"><span class="tm">'+['09:00','11:30','14:00','15:00','16:30','17:00'][i]+'</span><span class="bar"></span><div class="bd"><b>'+t.title+'</b><span>'+t.sub+'</span></div></div>';}).join('')+'</div><div class="g wgt"><h3>Quỹ tiền <a data-go="cash">Chi tiết</a></h3>'+WF.funds.map(function(f,i){return '<div class="ag" style="align-items:center"><span class="g-ico" data-tone="'+['ok','info','check'][i]+'" style="width:36px;height:36px;border-radius:12px;background:var(--tb);color:var(--tc);display:grid;place-items:center">'+ic(f.ic,17)+'</span><div class="bd" style="flex:1"><b>'+f.name+'</b></div><b>'+WF.short(f.bal)+'</b></div>';}).join('')+'</div></div>';
      var desk='<div class="tb g only-d"><h1>Chào anh Minh 👋</h1><small>Thứ Sáu, 16/10/2026 · hôm nay đã bán 3 chiếc, thu 33,4 triệu</small><div class="sp"></div><label class="s">'+ic('search',18)+'<input placeholder="Tìm đồng hồ, serial, khách…"></label><button class="cb" style="background:rgba(255,255,255,.7)" data-toast="Quét QR">'+ic('scan',20)+'</button><button class="btn pri" data-go="pos">'+ic('plus',18)+' Tạo phiếu bán</button></div><div class="pg only-d"><div class="dgrid"><div class="dm">'+wallet+kt+'<div class="g chartc"><div style="display:flex;align-items:center;justify-content:space-between"><h3 style="font-size:17px;font-weight:700">Doanh thu 1–16/10</h3><div class="seg" style="width:300px"><button class="on">Doanh thu</button><button>Lãi gộp</button><button>Thực thu</button></div></div>'+tipChart([S.rev16],14,'60,5 tr · 15/10',{w:400,h:170,colors:['#5B5BF0'],fillOp:.32,sw:2.8,dash:true})+'<div class="xl">'+S.days16.map(function(x){return '<span>'+x+'</span>';}).join('')+'</div></div><div class="two"><div><div class="sec" style="margin-top:0"><h3>Đơn hàng mới nhất</h3><a data-go="sales">Tất cả</a></div>'+orders+'</div><div><div class="sec" style="margin-top:0"><h3>Đang sửa chữa</h3><a data-go="repair">Tất cả</a></div>'+reps+'</div></div></div>'+wg+'</div></div>';
      return mob+desk;
    },
    stock:function(){
      var list=WF.watches.filter(function(w){return w.st!=='sold';});
      var chips=[['all','Tất cả 87'],['in_stock','Sẵn sàng 68'],['reserved','Đã giữ 6'],['in_repair','Đang sửa 8'],['inspecting','Chờ kiểm tra 5']];
      var body;
      /* mobile = inset list, desktop = card grid; both filter by same chips via wrapper children */
      var rows=list.map(function(w){return '<div class="ir" data-cat="'+w.st+'" data-go="unit" data-id="'+w.id+'"><span class="th">'+WF.img(w,{crop:'head'})+'</span><div class="m"><b>'+w.brand+' '+w.model+'</b><span>'+w.id+' · '+w.cond+'</span></div><div class="e"><b>'+WF.short(w.price)+'</b>'+chipSt(w.st)+'</div></div>';}).join('');
      var cards=list.map(function(w){return pcard(w,false);}).join('');
      body='<div class="sbar"><label class="g">'+ic('search',20)+'<input data-search="#sl" placeholder="Tên, mã, serial…"></label><button class="cb g" style="width:48px;height:48px" data-toast="Quét QR">'+ic('scan',20)+'</button></div><div class="g-chips" data-chips data-target="#sl">'+chips.map(function(c,i){return '<button class="g-chip'+(i?'':' on')+'" data-f="'+c[0]+'">'+c[1]+'</button>';}).join('')+'</div><div class="g ig only-m" id="sl">'+rows+'</div><div class="pgrid only-d" id="sg">'+cards+'</div>';
      return page('Đồng hồ','87 chiếc trong kho',body,{mAct:'<button class="cb g" data-toast="Nhập nhanh một chiếc">'+ic('plus',20)+'</button>',acts:'<button class="btn pri" data-toast="Nhập nhanh một chiếc">'+ic('plus',18)+' Nhập hàng</button>'});
