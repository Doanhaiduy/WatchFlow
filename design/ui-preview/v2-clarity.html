<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WatchFlow · Mẫu 2 — Clarity</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2347D5;--blue2:#3B6BF5;--blue-d:#1A36A8;--bg:#F2F5FB;--card:#fff;--ink:#0E1A3A;--mute:#6A7694;--line:#E4E9F5;
  --g:#12B76A;--gbg:#E6F8EF;--y:#F79009;--ybg:#FFF3D9;--b:#2F6BFF;--bbg:#E4EDFF;--r:#F04438;--rbg:#FFE8E6;--p:#7A5AF8;--pbg:#EFEAFF;
  --sh:0 1px 2px rgba(14,26,58,.04),0 10px 28px rgba(14,26,58,.07);
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font:400 14px/1.5 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1,'cv11' 1}
html.framed body::before{content:'';position:fixed;top:0;left:0;right:0;height:var(--safe-top);background:var(--blue);z-index:90}
button{background:none;border:0}a{color:inherit;text-decoration:none}
.only-d{display:none}
.card{background:var(--card);border-radius:20px;box-shadow:var(--sh)}

/* chips */
[data-tone=ok]{--tc:var(--g);--tb:var(--gbg)}[data-tone=bad]{--tc:var(--r);--tb:var(--rbg)}[data-tone=hold]{--tc:#B25E09;--tb:var(--ybg)}[data-tone=info]{--tc:var(--b);--tb:var(--bbg)}[data-tone=check]{--tc:var(--p);--tb:var(--pbg)}[data-tone=repair]{--tc:#0E7490;--tb:#DDF5FB}[data-tone=sold],[data-tone=draft]{--tc:#667085;--tb:#EEF0F5}
.wf-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--tb);color:var(--tc);white-space:nowrap;line-height:1.4}
.wf-chip::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--tc)}

.tools{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.tools .field{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;height:46px;padding:0 14px;color:var(--mute);min-width:0}.tools .field input{border:0;outline:0;background:none;font:400 15px Inter;flex:1;min-width:0}
/* ===== mobile header ===== */
.hdr{background:linear-gradient(165deg,#3A63F0 0%,#2347D5 55%,#1A36A8 100%);color:#fff;padding:calc(14px + var(--safe-top)) 18px 74px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.hdr::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%)}
.hdr.compact{padding-bottom:22px}
.hrow{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.av{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:800;flex:none}
.hrow .tx{flex:1;min-width:0}.hrow small{display:block;opacity:.75;font-size:12px}.hrow b{font-size:16px;font-weight:700}
.hdr h1{font-size:22px;font-weight:700;flex:1}
.ibtn{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff;position:relative;flex:none}
.ibtn .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;background:#FFB020;border-radius:50%;border:2px solid #2347D5}
.hsearch{margin-top:16px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:16px;padding:0 14px;height:48px;position:relative;z-index:1}
.hsearch input{flex:1;background:none;border:0;outline:0;color:#fff;font:400 15px Inter;min-width:0}.hsearch input::placeholder{color:rgba(255,255,255,.7)}
.pgbody{padding:0 16px calc(110px + var(--safe-bottom));margin-top:-52px;position:relative}
.pgbody.flat{margin-top:16px}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(14,26,58,.10);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(10px + var(--safe-bottom))}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;font-size:10.5px;color:var(--mute);font-weight:500}
.bnav a i{width:46px;height:30px;border-radius:15px;display:grid;place-items:center;transition:.2s}
.bnav a.on{color:var(--blue);font-weight:700}.bnav a.on i{background:var(--bbg)}

/* more sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:95;background:#fff;border-radius:28px 28px 0 0;padding:10px 18px calc(24px + var(--safe-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
.sheet.open{transform:none}.sheet.open~.scrim{opacity:1;pointer-events:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#D5DBEA;margin:0 auto 14px}
.scrim{position:fixed;inset:0;background:rgba(14,26,58,.4);z-index:92;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet h3{font-size:18px;margin-bottom:14px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.mgrid a{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500;text-align:center}
.mgrid a i{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--tb);color:var(--tc)}

/* hero card */
.hero{padding:18px 18px 14px}
.hero .top{display:flex;align-items:center;justify-content:space-between}
.hero .lbl{color:var(--mute);font-size:12.5px;font-weight:500}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:2px 0}
.hero .big small{font-size:16px;font-weight:600;color:var(--mute);margin-left:3px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--gbg);color:#0B8A50}
.pill.neg{background:var(--rbg);color:var(--r)}
.hero .ring{position:relative;display:grid;place-items:center}.hero .ring b{position:absolute;font-size:13px;font-weight:800}
.hero .ch{height:120px;margin:10px -4px 4px;color:#9AA7C7}
.xl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute);padding:0 2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tile{border-radius:20px;padding:14px;background:var(--tb);position:relative;min-height:112px;display:flex;flex-direction:column}
.tile .ti{width:34px;height:34px;border-radius:11px;background:#fff;display:grid;place-items:center;color:var(--tc)}
.tile .tn{font-size:12px;color:#4A5675;margin-top:10px;font-weight:500}
.tile b{font-size:19px;font-weight:800;letter-spacing:-.01em;display:block;margin-top:2px}
.tile em{font-style:normal;font-size:11px;color:var(--mute)}
.tile .ar{position:absolute;top:12px;right:12px;color:var(--tc);opacity:.8}
.sec{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 12px}
.sec h3{font-size:17px;font-weight:700}.sec a,.sec button{font-size:13px;color:var(--blue);font-weight:600;cursor:pointer}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button,.quick a{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;font-weight:600;text-align:center;cursor:pointer}
.quick i{width:54px;height:54px;border-radius:18px;background:var(--tb);color:var(--tc);display:grid;place-items:center}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.th{width:48px;height:48px;border-radius:14px;background:#F0F3FB;flex:none;padding:3px;overflow:hidden}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .tx span{font-size:12px;color:var(--mute)}
.row .rt{text-align:right;flex:none}.row .rt b{display:block;font-size:14px;font-weight:700}
.row .ico{width:40px;height:40px;border-radius:13px;background:var(--tb);color:var(--tc);display:grid;place-items:center;flex:none}
.fbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--mute)}
.seg{display:flex;background:#E8EDF8;border-radius:14px;padding:4px;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.seg::-webkit-scrollbar{display:none}
.seg button,.seg .g-chip{flex:1;padding:8px 14px;border-radius:11px;font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}
.seg .on{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(14,26,58,.08)}
.g-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}.g-chips::-webkit-scrollbar{display:none}
.g-chip{padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap;cursor:pointer}
.g-chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:14px;font-weight:600;font-size:14px;background:#fff;border:1px solid var(--line);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 8px 18px rgba(35,71,213,.28)}
.btn.block{width:100%}.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.ok{background:var(--g);border-color:var(--g);color:#fff}

/* generic pages */
.g-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.g-kpi{background:#fff;border-radius:16px;padding:12px;box-shadow:var(--sh)}.g-kpi:nth-child(1){background:var(--bbg)}.g-kpi:nth-child(2){background:var(--gbg)}.g-kpi:nth-child(3){background:var(--ybg)}.g-kpi{box-shadow:none}
.g-kpi span{display:block;font-size:11px;color:#4A5675;font-weight:500;line-height:1.3;min-height:28px}.g-kpi b{font-size:18px;font-weight:800;display:block;margin-top:4px}.g-kpi em{font-style:normal;font-size:10.5px;color:var(--mute)}
.g-list{background:#fff;border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.g-item{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}.g-item:last-child{border:0}
.g-ico{width:42px;height:42px;border-radius:14px;background:var(--tb,var(--bbg));color:var(--tc,var(--b));display:grid;place-items:center;flex:none}
.g-av{font-weight:800;font-size:14px}
.g-main{flex:1;min-width:0}.g-t{font-weight:600;line-height:1.35}.g-s{font-size:12px;color:var(--mute);margin-top:2px}
.g-end{text-align:right;flex:none;max-width:44%}.g-amt{font-weight:800;font-size:15px}.g-sub{font-size:11.5px;color:var(--mute)}
[data-neg]{color:var(--r);font-weight:600}
.g-bar{height:6px;border-radius:3px;background:#EAEFFA;margin-top:8px;max-width:200px;overflow:hidden}.g-bar i{display:block;height:100%;background:var(--tc);border-radius:3px}
.g-thumb{width:60px;flex:none}.g-thumb .wf-img{aspect-ratio:1;background:#F0F3FB;border-radius:14px;padding:3px}
.g-btns{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.g-btn{font-size:12px;font-weight:600;padding:6px 12px;border-radius:10px;background:var(--blue);color:#fff}.g-btn.ghost{background:#fff;color:var(--mute);border:1px solid var(--line)}
.g-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;height:48px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;box-shadow:0 8px 18px rgba(35,71,213,.28)}
.g-block{margin-bottom:22px}.g-h{font-size:16px;font-weight:700;margin-bottom:10px}
.g-res{align-items:flex-start}

/* stock mobile cards / pos grid */
.cardrow{display:flex;gap:12px;align-items:center;padding:12px;background:#fff;border-radius:18px;box-shadow:var(--sh);margin-bottom:10px;cursor:pointer}
.cardrow .th{width:64px;height:64px;border-radius:16px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:10px;position:relative;cursor:pointer;display:flex;flex-direction:column}
.pc .ph{aspect-ratio:1/1;border-radius:14px;background:linear-gradient(180deg,#F4F7FE,#E9EEFA);padding:6px}
.pc b{font-size:13px;font-weight:600;margin-top:8px;line-height:1.3;min-height:34px}.pc small{color:var(--mute);font-size:11px}
.pc .pr{display:flex;align-items:center;justify-content:space-between;margin-top:6px}.pc .pr strong{font-size:15px;font-weight:800;color:var(--blue)}
.pc .add{width:34px;height:34px;border-radius:12px;background:var(--bbg);color:var(--blue);display:grid;place-items:center}.pc .add.in{background:var(--blue);color:#fff}

/* unit */
.unit{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.photo{border-radius:24px;background:linear-gradient(180deg,#EEF3FF,#DDE6FB);aspect-ratio:1/1;position:relative;padding:5% 18%;overflow:hidden}
.photo .st{position:absolute;top:14px;left:14px}.photo .qr{position:absolute;right:14px;bottom:14px;width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center}
.unit h1{font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.unit .pr{font-size:30px;font-weight:800;color:var(--blue);margin:6px 0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}.kv div span{color:var(--mute)}.kv div b{font-weight:600;text-align:right}
.lock{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);margin-top:12px;padding:10px 12px;background:var(--ybg);border-radius:12px}
.tl{list-style:none;padding:0}.tl li{position:relative;padding:0 0 18px 24px}.tl li::before{content:'';position:absolute;left:0;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--bbg)}.tl li::after{content:'';position:absolute;left:4.5px;top:18px;bottom:0;width:1px;background:var(--line)}.tl li:last-child::after{display:none}.tl li b{display:block;font-weight:600}.tl li span{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 14px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}.tabs button.on{color:var(--blue);border-color:var(--blue)}

/* POS cart */
.pos{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.cartbar{position:fixed;left:14px;right:14px;bottom:calc(84px + var(--safe-bottom));z-index:45;background:var(--ink);color:#fff;border-radius:18px;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;box-shadow:0 14px 30px rgba(14,26,58,.35)}
.cartbar .t{flex:1}.cartbar small{display:block;color:#9FB0DA;font-size:11.5px}.cartbar b{font-size:18px;font-weight:800}
.cart{position:fixed;left:0;right:0;bottom:0;z-index:96;background:#fff;border-radius:28px 28px 0 0;padding:12px 18px calc(22px + var(--safe-bottom));transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto}
.cart.open{transform:none}.cart.open~.scrim{opacity:1;pointer-events:auto}
.cart h3{font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.cl{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cl .tx{flex:1;min-width:0}.cl .tx b{display:block;font-weight:600;font-size:14px}.cl .tx span{font-size:12px;color:var(--mute)}
.cl .p{font-weight:700;min-width:76px;text-align:right}.cl .rm{color:var(--mute);padding:4px}
.cl .th{width:44px;height:44px;border-radius:12px}
.qty{display:flex;align-items:center;background:#EEF2FB;border-radius:10px;height:30px}.qty button{width:28px;height:30px;display:grid;place-items:center}.qty span{min-width:20px;text-align:center;font-weight:600}
.sum div{display:flex;justify-content:space-between;padding:7px 0;color:var(--mute)}.sum div b{color:var(--ink);font-weight:600}
.sum .tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;font-weight:600;color:var(--ink);align-items:baseline}.sum .tot b{font-size:26px;font-weight:800;color:var(--blue)}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pills button{height:42px;border-radius:12px;background:#EEF2FB;font-weight:600;font-size:13px;color:var(--mute)}.pills button.on{background:var(--blue);color:#fff}
.recv{display:flex;align-items:center;gap:10px;background:#F3F6FD;border-radius:14px;padding:8px 14px;margin-bottom:6px}
.recv span{font-size:12px;color:var(--mute)}.recv input{flex:1;border:0;background:none;text-align:right;font:800 22px Inter;outline:0;min-width:0;color:var(--ink)}
.calc{display:flex;justify-content:space-between;font-size:13px;padding:4px 4px 14px;color:var(--mute)}.calc b{font-weight:700}.calc .ok{color:var(--g)}.calc .bad{color:var(--r)}
.cust{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:#F3F6FD;margin:10px 0;cursor:pointer;font-weight:600}.cust span{color:var(--mute);font-weight:400;font-size:12px;display:block}

/* repair / cash */
.rc{padding:14px;margin-bottom:12px}
.rc .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);font-weight:600}
.rc h4{font-size:16px;font-weight:700;margin:6px 0 2px}.rc p{color:var(--mute);font-size:13px}
.rc .ft{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--mute)}.rc .ft b{color:var(--ink);font-size:15px;font-weight:800}
.fund{border-radius:20px;padding:16px;color:#fff;position:relative;overflow:hidden;min-height:104px}
.fund span{font-size:12px;opacity:.8}.fund b{display:block;font-size:22px;font-weight:800;margin-top:4px}.fund small{opacity:.75}.fund .ico{position:absolute;right:14px;top:14px;opacity:.5}
.fund.f0{background:linear-gradient(135deg,#2347D5,#4F7BFF)}.fund.f1{background:linear-gradient(135deg,#0E9F6E,#34D399)}.fund.f2{background:linear-gradient(135deg,#7A5AF8,#A78BFA)}.fund.f3{background:linear-gradient(135deg,#0E1A3A,#33437A)}
.funds{display:grid;gap:12px;grid-template-columns:1fr 1fr}.funds .f0{grid-column:1/-1}
.lg{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.lg:last-child{border:0}
.lg .ic2{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.lg .tx{flex:1;min-width:0}.lg .tx b{display:block;font-weight:600;font-size:14px}.lg .tx span{font-size:12px;color:var(--mute)}.lg .a{font-weight:800}.lg .a.in{color:#0B8A50}.lg .a.out{color:var(--r)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-bottom:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.fld{display:block;margin-bottom:12px}.fld span{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-bottom:4px}.fld input,.fld textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:400 15px Inter;outline:0;background:#fff}
.steps{display:flex;gap:6px;margin:6px 0 16px}.steps button{flex:1;height:34px;border-radius:10px;background:#EEF2FB;font-size:12px;font-weight:600;color:var(--mute)}.steps button.on{background:var(--blue);color:#fff}
.modal{position:fixed;left:0;right:0;bottom:0;z-index:96;background:#fff;border-radius:28px 28px 0 0;padding:12px 18px calc(22px + var(--safe-bottom));transform:translateY(105%);transition:.35s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto}.modal.open{transform:none}.modal.open~.scrim{opacity:1;pointer-events:auto}.modal h3{font-size:19px;margin-bottom:6px}
.tbl{width:100%;border-collapse:collapse}

      '<div class="dash">'+kc('info','chart','Doanh thu',WF.short(k.revMonth),12.4,S.rev16,'report')+kc('ok','trendup','Lãi gộp',WF.short(k.profit),8.1,S.profit16,'report')+kc('hold','wallet','Thực thu',WF.short(k.cashIn),5.6,S.rev16.slice().reverse(),'cash')+kc('check','watch','Giá trị tồn (vốn)',WF.short(k.stockValue),-2.3,[5,6,7,6,8,7,6,5,6,5,4,5],'stock')+

    cart.innerHTML='<div class="grab"></div><h3><span>Phiếu HD-1016-004</span><button class="xb" data-close="#cart" style="color:var(--mute)">'+ic('x',22)+'</button></h3><div class="cust" data-toast="Chọn / tạo nhanh khách"><div>Khách lẻ<span>Chạm để chọn khách hàng</span></div>'+ic('chevR',18)+'</div>'+
      (lines.length?lines.map(function(l){return '<div class="cl">'+(l.w?'<div class="th">'+WF.img(l.w,{crop:'head'})+'</div>':'<div class="th" style="display:grid;place-items:center;color:var(--blue)">'+ic(l.ic,20)+'</div>')+'<div class="tx"><b>'+l.name+'</b><span>'+l.sub+'</span></div>'+(l.kind==='acc'?'<div class="qty"><button data-inc="'+l.id+'" data-d="-1">'+ic('minus',14)+'</button><span>'+l.q+'</span><button data-inc="'+l.id+'" data-d="1">'+ic('plus',14)+'</button></div>':'')+'<div class="p">'+WF.num(l.price*l.q)+'</div><button class="rm" data-rm="'+l.id+'">'+ic('x',16)+'</button></div>';}).join(''):'<p style="padding:28px 0;text-align:center;color:var(--mute)">Chưa có món nào. Chọn đồng hồ hoặc quét QR.</p>')+
      '<div class="sum"><div><span>Tạm tính</span><b>'+vnd(C.sub())+'</b></div><div><span>Giảm giá (tối đa 5%)</span><b>−'+WF.num(C.discount)+'</b></div><div data-toast="Thêm máy cũ — thu cũ đổi mới" style="cursor:pointer"><span>Thu cũ đổi mới</span><b style="color:var(--blue)">+ Thêm máy cũ</b></div><div class="tot"><span>Tổng phải trả</span><b>'+vnd(t)+'</b></div></div>'+
      '<div class="pills"><button data-method="cash" class="'+(WF.pay.method==='cash'?'on':'')+'">Tiền mặt</button><button data-method="bank" class="'+(WF.pay.method==='bank'?'on':'')+'">Chuyển khoản</button><button data-method="mix" class="'+(WF.pay.method==='mix'?'on':'')+'">Kết hợp</button></div><label class="recv"><span>Khách đưa</span><input data-recv inputmode="numeric" value="'+WF.num(WF.pay.val())+'"></label><div class="calc" data-calc>'+WF.pay.html()+'</div>'+
      '<button class="btn pri block" style="height:50px;font-size:15px'+(lines.length?'':';opacity:.45')+'" data-toast="Đã xác nhận phiếu — in phiếu bán">Xác nhận & in phiếu</button>';
    var bar=$('#cartbar'); if(bar) bar.innerHTML='<div class="t"><small>'+C.count()+' món · phiếu nháp</small><b>'+vnd(t)+'</b></div><button class="btn pri" data-open="#cart">Xem phiếu '+ic('chevU',16)+'</button>';
    WF.$$('.pc .add').forEach(function(b){b.classList.toggle('in',C.has(b.dataset.add));});
  }
  var app=WF.app({view:'#view',screens:screens,home:'home',onRoute:function(id){
    var key=id==='unit'?'stock':id==='sales'?'pos':id;
    WF.$$('#side a, #bnav a[data-go]').forEach(function(a){a.classList.toggle('on',a.dataset.go===key);});
    var mo=$('#bnav a[data-open]'); if(mo) mo.classList.toggle('on',['home','stock','pos','repair'].indexOf(key)<0);
    $('#more').classList.remove('open');
    if(id==='pos'){WF.pay.reset();C.cb=renderCart;renderCart();}else C.cb=null;
  }});
})();
</script>
</body>
